name: Build Desktop Pet for Windows & Mac

on: [push, workflow_dispatch]

jobs:
  build-macos:
    # 使用拥有海量空闲机器的 macos-latest，秒开不排队
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      
    steps:
      - uses: actions/checkout@v4
      
      # 通过 Rosetta 2 安装专用的 Intel x86_64 架构 Python 3.9，完美匹配老款 Mac
      - name: Set up Python x64 (兼容 macOS 10.15+ Intel Mac)
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: "x64"
          
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install "PyQt5<5.16" pyinstaller Pillow
          
      - name: Build macOS App Bundle
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "HelloKitty桌宠" \
            --osx-bundle-identifier "com.kitty.desktoppet" \
            --add-data "assets:assets" \
            main.py
            
      # 强制将最低支持系统版本写入 Info.plist，彻底解决“要求 macOS 11.0”报错
      - name: Patch Info.plist for macOS 10.15
        run: |
          plutil -replace LSMinimumSystemVersion -string "10.15.0" "dist/HelloKitty桌宠.app/Contents/Info.plist"
          
      - name: Create Zip for Girlfriend
        run: |
          cd dist
          zip -r -y HelloKitty-Mac通用版.zip "HelloKitty桌宠.app"
          
      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloKitty-Mac版
          path: dist/HelloKitty-Mac通用版.zip
