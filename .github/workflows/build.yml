name: Build Desktop Pet for Windows & Mac

on: [push, workflow_dispatch]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install PyQt6 pyinstaller Pillow
          
      - name: Build macOS App Bundle
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "HelloKitty桌宠" \
            --add-data "assets:assets" \
            main.py
            
      - name: Create Zip for Girlfriend
        run: |
          cd dist
          zip -r -y HelloKitty_Mac版.zip "HelloKitty桌宠.app"
          
      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloKitty-Mac版
          path: dist/HelloKitty_Mac版.zip
